<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<title>contact-router harness</title>
<style>
  /* === 站上 Webflow class 的實際值 === */
  .contact-router_panel{
    width:100%; height:0px; overflow:hidden; opacity:0; visibility:hidden;
    transition-property:height, opacity, visibility;
    transition-duration:800ms, 900ms, 0s;
    transition-timing-function:cubic-bezier(.22,.61,.36,1), ease, linear;
    transition-delay:0s, 150ms, 800ms;
  }
  .contact-router_panel.is-open{
    height:auto; opacity:1; visibility:visible;
    transition-delay:0s, 150ms, 0s;
  }
  .section_contact-router{ scroll-margin-top:6rem; }
  .top-switcher_item{padding:.5rem 1.5rem;cursor:pointer;border-radius:50px;text-decoration:none;color:#08484E}
  .top-switcher_item.is-active{background:#00b2c0;color:#fff}
  .top-switcher_wrapper{display:flex;gap:.25rem;padding:.25rem;border-radius:50px;background:rgba(255,255,255,.3)}
  .contact-router_component{display:flex;flex-direction:column;align-items:center;width:100%;row-gap:0}
  .navbar_component{position:fixed;top:0;left:0;right:0;height:72px;background:#fff;z-index:9}
  .spacer{height:1200px}
  body{margin:0;font-family:system-ui}
</style>
<!-- ============================================================
     /contact 分流面板：展開／切換動畫
     放置位置：Page Settings → Custom Code → Inside <head> tag（僅這一頁）
     鐵律 4 的例外，2026-09-10 經 Terris 明確要求後採用。

     ⚠️ 收合／展開的「狀態」不在這裡，而是在 Webflow 的 class 上：
        .contact-router_panel          → height 0 / overflow hidden / opacity 0 / visibility hidden
        .contact-router_panel.is-open  → height auto / opacity 1 / visibility visible
     原因：Webflow 的 Designer 與 Preview 都不執行 page custom code。
     狀態放在 class 才能保證「沒按按鈕時是隱藏的」在 canvas、Preview、
     發布後三個地方都一致；這支 code 只負責時序、量高度、切 class、控制捲動。

     切換的時序（Terris 2026-09-10 指定）：
       舊卡片「直接淡出」（只動 opacity，高度先鎖住 → 不會回流）
       → 高度瞬間歸零（此時已看不見，不會有跳動）
       → 新卡片高度往下展開 ＋ 淡入 ＋ 由上往下滑入
     方向一律由上往下。
     ============================================================ -->
<style>
  /* 新卡片進場：從上方滑下來就位 */
  [data-router-panel] > * {
    transform: translateY(-1.5rem);
    transition: transform .9s cubic-bezier(.22,.61,.36,1) .15s;
  }
  [data-router-panel].is-open > * {
    transform: none;
  }
  /* 舊卡片淡出：高度鎖住、只淡 opacity */
  [data-router-panel].is-fading {
    opacity: 0 !important;
    transition: opacity .3s ease !important;
  }
  /* 淡完之後把高度歸零：所有過場關掉，不要有收合動畫 */
  [data-router-panel].is-instant,
  [data-router-panel].is-instant > * {
    transition: none !important;
  }
  [data-router-target] { cursor: pointer; }
  @media (prefers-reduced-motion: reduce) {
    [data-router-panel], [data-router-panel] > * { transition: none !important; }
  }
</style>
<noscript>
  <style>
    [data-router-panel] {
      height: auto !important;
      overflow: visible !important;
      opacity: 1 !important;
      visibility: visible !important;
    }
    [data-router-panel] > * { transform: none !important; }
  </style>
</noscript>
<script>
  (function () {
    var EXPAND = 800;    // 必須等於 .contact-router_panel 的 height transition-duration
    var FADE_OUT = 300;  // 必須等於上面 .is-fading 的 opacity transition-duration
    var SCROLL = 1.4;    // 秒，交給 Lenis

    function ready(fn) {
      if (document.readyState !== 'loading') fn();
      else document.addEventListener('DOMContentLoaded', fn);
    }

    ready(function () {
      var wrapper = document.querySelector('[data-router="wrapper"]');
      if (!wrapper) return;
      var items = [].slice.call(wrapper.querySelectorAll('[data-router-target]'));
      var panels = [].slice.call(document.querySelectorAll('[data-router-panel]'));
      if (!items.length || !panels.length) return;

      function panelFor(key) {
        for (var i = 0; i < panels.length; i++) {
          if (panels[i].getAttribute('data-router-panel') === key) return panels[i];
        }
        return null;
      }

      function openPanel() {
        for (var i = 0; i < panels.length; i++) {
          if (panels[i].classList.contains('is-open')) return panels[i];
        }
        return null;
      }

      // 高度歸零，不做任何過場
      function zeroInstant(panel) {
        panel.classList.add('is-instant');
        panel.classList.remove('is-open');
        panel.style.height = '0px';
        void panel.offsetHeight;   // 讀一次 layout 讓瀏覽器立刻套用
        panel.classList.remove('is-instant');
        panel.classList.remove('is-fading');
      }

      // 點同一顆關閉 → 高度收合動畫
      function collapse(panel) {
        if (!panel || !panel.classList.contains('is-open')) return;
        panel.style.height = panel.scrollHeight + 'px';
        panel.classList.remove('is-open');
        requestAnimationFrame(function () { panel.style.height = '0px'; });
      }

      // 切換 → 舊卡片先淡出，淡完才歸零
      function fadeOut(panel, done) {
        if (!panel || !panel.classList.contains('is-open')) { done(); return; }
        panel.style.height = panel.scrollHeight + 'px';   // 鎖住高度，淡出期間不回流
        void panel.offsetHeight;
        panel.classList.add('is-fading');
        window.setTimeout(function () {
          zeroInstant(panel);
          done();
        }, FADE_OUT);
      }

      function expand(panel) {
        if (!panel) return;
        panel.classList.add('is-open');
        panel.style.height = panel.scrollHeight + 'px';
        window.setTimeout(function () {
          if (panel.classList.contains('is-open')) panel.style.height = 'auto';
        }, EXPAND);
      }

      // 捲到按鈕本身（按鈕在 Hero 裡），按鈕會停在 navbar 下方，
      // 剛展開的面板正好在它底下。站上的 Slater JS 有 window.lenis，
      // 優先交給它，直接用原生 scrollIntoView 會跟 Lenis 的 RAF 迴圈互相干擾。
      function bringIntoView() {
        var nav = document.querySelector('[class*="navbar"], nav, header');
        var clearance = (nav ? nav.getBoundingClientRect().height : 0) + 24;
        if (window.lenis && typeof window.lenis.scrollTo === 'function') {
          window.lenis.scrollTo(wrapper, { offset: -clearance, duration: SCROLL });
        } else if (wrapper.scrollIntoView) {
          wrapper.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      }

      items.forEach(function (item) {
        item.addEventListener('click', function (event) {
          // 保留 href 讓站台 head 的 GA4 事件抓得到（它以 capture 監聽 a[href]，
          // 會在這裡之前就送出），但不要讓瀏覽器跳 anchor。
          // stopPropagation 擋掉 Webflow 自己與 Lenis 掛在 document bubble 階段的
          // 捲動處理；真正要的捲動由 bringIntoView() 控制。
          event.preventDefault();
          event.stopPropagation();

          var wasActive = item.classList.contains('is-active');
          var target = panelFor(item.getAttribute('data-router-target'));
          items.forEach(function (el) { el.classList.remove('is-active'); });

          if (wasActive) {          // 點同一顆 → 收合
            collapse(target);
            return;
          }

          item.classList.add('is-active');
          var current = openPanel();
          if (current && current !== target) {
            fadeOut(current, function () {   // 舊的淡出 → 新的滑入
              expand(target);
              bringIntoView();
            });
          } else {
            expand(target);
            bringIntoView();
          }
        });
      });

      window.addEventListener('resize', function () {
        panels.forEach(function (p) {
          if (p.classList.contains('is-open')) p.style.height = 'auto';
        });
      });
    });
  })();
</script>

</head><body>
<div class="navbar_component">navbar</div>
<div class="spacer" style="padding-top:72px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:4rem">
  <div>hero 佔位（H1／說明）</div>
  <div class="top-switcher_wrapper is-product" data-router="wrapper" style="margin-top:2rem">
    <a class="top-switcher_item" href="#choose" data-router-target="homecare"
       data-ga-event="contact_route_select" data-solution-interest="home_care">我是居服單位</a>
    <a class="top-switcher_item" href="#choose" data-router-target="residential"
       data-ga-event="contact_route_select" data-solution-interest="residential_day_care">我是住宿／日照機構</a>
  </div>
</div>
<section id="choose" class="section_contact-router">
  <div class="contact-router_component">
    <div class="contact-router_panel" data-router-panel="homecare">
      <section id="homecare" style="padding:4rem 0"><div style="height:700px;background:#e6f7f8">居服窗口卡</div></section>
      <div style="height:500px;background:#f0fbfc">居服系統 banner</div>
    </div>
    <div class="contact-router_panel" data-router-panel="residential">
      <div id="sales" style="padding:4rem 0"><div style="height:900px;background:#eef">5 位客戶經理</div></div>
    </div>
  </div>
</section>
<div class="spacer">後面的區塊</div>
<script>
  window.__ga = [];
  document.addEventListener('click', function(e){
    var a = e.target.closest && e.target.closest('a[href]');
    if(a && a.dataset.gaEvent) window.__ga.push({event:a.dataset.gaEvent, si:a.dataset.solutionInterest});
  }, true);
  window.__bubbleScrolls = 0;
  document.addEventListener('click', function(e){
    var a = e.target.closest && e.target.closest('a[href^="#"]');
    if(!a) return;
    var t = document.querySelector(a.getAttribute('href'));
    if(t){ window.__bubbleScrolls++; t.scrollIntoView(); }
  });
</script>
</body></html>
