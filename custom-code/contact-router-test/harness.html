<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<title>contact-router harness</title>
<!--
  這是**模板**，不是可以直接開的頁面。
  test_router.mjs 會把 ../contact-router.html 的內容原封不動塞進下面的
  ROUTER_SNIPPET 位置，產生 harness.generated.html 再跑。
  這樣「測試跑的 code」與「裝到 Webflow 的 code」永遠是同一份。
-->
<style>
  /* === 站上 Webflow class 的實際值（2026-09-10 讀回） === */
  .contact-router_stage{
    width:100%; height:0px; overflow:hidden;
    transition:height 800ms cubic-bezier(.22,.61,.36,1);
  }
  .contact-router_panel{
    width:100%; display:none; opacity:0;
    transition-property:opacity;
    transition-duration:900ms;
    transition-timing-function:ease;
    transition-delay:150ms;
  }
  .contact-router_panel.is-open{ display:block; opacity:1; }
  .contact-router_component{display:flex;flex-direction:column;align-items:center;width:100%;row-gap:0;column-gap:0}
  .section_contact-router{ scroll-margin-top:6rem; }
  /* 分流入口：2026-09-10 由 pill 改成兩張獨立選擇卡 */
  /* contact-choice_layout：抄 padding-global 的左右值 ＋ 自己的上下留白 */
  .contact-choice_layout{padding:4rem}
  .container-large{width:100%;max-width:82rem;margin:0 auto;display:block}
  .contact-choice_wrap{display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;
    flex-wrap:nowrap;width:100%;grid-column-gap:1.5rem;grid-row-gap:1.5rem;
    max-width:24rem;margin-left:auto;margin-right:auto}
  .contact-choice_item{display:flex;flex-direction:row;align-items:center;justify-content:space-between;
    grid-column-gap:1rem;flex-grow:0;flex-shrink:1;flex-basis:auto;max-width:none;width:100%;
    padding:1.5rem;border-radius:1.25rem;border:1px solid rgba(105,131,146,.15);
    background:rgba(255,255,255,.5);color:#151717;text-decoration:none;text-align:left;
    transition:background-color .25s ease,border-color .25s ease,color .25s ease,transform .25s ease}
  .contact-choice_item.is-active{background:#00b2c0;border-color:#00b2c0;color:#fff}
  .contact-choice_text-wrap{display:flex;flex-direction:column;align-items:flex-start;grid-row-gap:.25rem}
  .contact-choice_title{font-size:1.125rem;font-weight:500;line-height:150%;color:currentColor}
  .contact-choice_desc{font-size:.875rem;line-height:150%;color:currentColor;opacity:.65}
  /* 箭頭徽章：站上 navbar「預約諮詢」那顆 gradient arrow（#00B2C0 → #3B58FF） */
  .contact-choice_arrow{display:flex;justify-content:center;align-items:center;width:2rem;height:2rem;
    flex-shrink:0;border-radius:50%;background:#fff;overflow:clip}
  .contact-choice_arrow-icon{display:flex;justify-content:center;align-items:center;
    width:1.125rem;height:1.125rem;flex-shrink:0}
  .navbar_component{position:fixed;top:0;left:0;right:0;height:72px;background:#fff;z-index:9}
  .spacer{height:1200px}
  body{margin:0;font-family:system-ui}
</style>
<!-- ROUTER_SNIPPET -->
</head><body>
<div class="navbar_component">navbar</div>
<div class="spacer" style="padding-top:72px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:4rem">
  <div>hero 佔位（H1／說明／已隱藏的舊 pill）</div>
</div>
<section id="choose" class="section_contact-router">
  <div class="contact-choice_layout"><div class="container-large">
  <div class="contact-choice_wrap" data-router="wrapper">
    <a class="contact-choice_item" href="#choose" data-router-target="homecare"
       data-ga-event="contact_route_select" data-solution-interest="home_care"
       data-ga-cta-location="contact_router_choice">
      <div class="contact-choice_text-wrap">
        <div class="contact-choice_title">我是居服單位</div>
      </div>
      <div class="contact-choice_arrow"><div class="contact-choice_arrow-icon"><svg width="100%" height="100%" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M1.6016 9.33556L1.6016 8.13241L14.1478 8.13253L10.487 4.47178L11.3464 3.61241L16.468 8.73398L11.3464 13.8556L10.487 12.9962L14.1478 9.33543L1.6016 9.33556Z" fill="#00B2C0"/></svg></div></div>
    </a>
    <a class="contact-choice_item" href="#choose" data-router-target="residential"
       data-ga-event="contact_route_select" data-solution-interest="residential_day_care"
       data-ga-cta-location="contact_router_choice">
      <div class="contact-choice_text-wrap">
        <div class="contact-choice_title">我是住宿・日照機構</div>
      </div>
      <div class="contact-choice_arrow"><div class="contact-choice_arrow-icon"><svg width="100%" height="100%" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M1.6016 9.33556L1.6016 8.13241L14.1478 8.13253L10.487 4.47178L11.3464 3.61241L16.468 8.73398L11.3464 13.8556L10.487 12.9962L14.1478 9.33543L1.6016 9.33556Z" fill="#00B2C0"/></svg></div></div>
    </a>
  </div>
  </div></div>
  <div class="contact-router_component">
    <div class="contact-router_stage" data-router="stage">
      <div class="contact-router_panel" data-router-panel="homecare">
        <section id="homecare" style="padding:4rem 0"><div style="height:700px;background:#e6f7f8">居服窗口卡</div></section>
        <div style="height:500px;background:#f0fbfc">居服系統 banner</div>
      </div>
      <div class="contact-router_panel" data-router-panel="residential">
        <div id="sales" style="padding:4rem 0"><div style="height:900px;background:#eef">5 位客戶經理</div></div>
      </div>
    </div>
  </div>
</section>
<div class="spacer">後面的區塊</div>
<script>
  window.__ga = [];
  document.addEventListener('click', function(e){
    var a = e.target.closest && e.target.closest('a[href]');
    if(a && a.dataset.gaEvent) window.__ga.push({event:a.dataset.gaEvent, si:a.dataset.solutionInterest});
  }, true);
  window.__bubbleScrolls = 0;
  document.addEventListener('click', function(e){
    var a = e.target.closest && e.target.closest('a[href^="#"]');
    if(!a) return;
    var t = document.querySelector(a.getAttribute('href'));
    if(t){ window.__bubbleScrolls++; t.scrollIntoView(); }
  });
</script>
</body></html>
