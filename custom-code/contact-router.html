<!-- ============================================================
     /contact 分流面板：展開動畫（JS）
     放置位置：Page Settings → Custom Code → Inside <head> tag（僅這一頁）
     鐵律 4 的例外，2026-09-10 經 Terris 明確要求後採用。

     ⚠️ 收合／展開的「狀態」不在這裡，而是在 Webflow 的 class 上：
        .contact-router_panel          → height 0 / overflow hidden / opacity 0 / visibility hidden
        .contact-router_panel.is-open  → opacity 1 / visibility visible
     原因：Webflow 的 Designer 與 Preview 都不執行 page custom code。
     狀態放在 class 才能保證「沒按按鈕時是隱藏的」在 canvas、Preview、
     發布後三個地方都一致；這支 code 只負責量高度、切 .is-open。
     ============================================================ -->
<style>
  /* 只有錦上添花的位移：內容展開時從上方「吐」出來。沒跑到也不影響隱藏行為。 */
  [data-router-panel] > * {
    transform: translateY(-1rem);
    transition: transform .5s cubic-bezier(.22,.61,.36,1) .08s;
  }
  [data-router-panel].is-open > * {
    transform: none;
  }
  [data-router-target] { cursor: pointer; }
  @media (prefers-reduced-motion: reduce) {
    [data-router-panel], [data-router-panel] > * { transition: none !important; }
  }
</style>
<noscript>
  <style>
    [data-router-panel] {
      height: auto !important;
      overflow: visible !important;
      opacity: 1 !important;
      visibility: visible !important;
    }
    [data-router-panel] > * { transform: none !important; }
  </style>
</noscript>
<script>
  (function () {
    var DURATION = 450;

    function ready(fn) {
      if (document.readyState !== 'loading') fn();
      else document.addEventListener('DOMContentLoaded', fn);
    }

    ready(function () {
      var wrapper = document.querySelector('[data-router="wrapper"]');
      if (!wrapper) return;
      var items = [].slice.call(wrapper.querySelectorAll('[data-router-target]'));
      var panels = [].slice.call(document.querySelectorAll('[data-router-panel]'));
      if (!items.length || !panels.length) return;

      function panelFor(key) {
        for (var i = 0; i < panels.length; i++) {
          if (panels[i].getAttribute('data-router-panel') === key) return panels[i];
        }
        return null;
      }

      function collapse(panel) {
        if (!panel || !panel.classList.contains('is-open')) return;
        panel.style.height = panel.scrollHeight + 'px';
        panel.classList.remove('is-open');
        requestAnimationFrame(function () { panel.style.height = '0px'; });
      }

      function expand(panel) {
        if (!panel) return;
        panel.classList.add('is-open');
        panel.style.height = panel.scrollHeight + 'px';
        window.setTimeout(function () {
          if (panel.classList.contains('is-open')) panel.style.height = 'auto';
        }, DURATION);
      }

      items.forEach(function (item) {
        item.addEventListener('click', function (event) {
          // 保留 href 讓站台 head 的 GA4 事件抓得到（它以 capture 監聽 a[href]，
          // 會在這裡之前就送出），但不要讓瀏覽器真的跳 anchor。
          event.preventDefault();

          var wasActive = item.classList.contains('is-active');
          var target = panelFor(item.getAttribute('data-router-target'));

          items.forEach(function (el) { el.classList.remove('is-active'); });
          panels.forEach(function (p) { if (p !== target) collapse(p); });

          if (wasActive) { collapse(target); return; }
          item.classList.add('is-active');
          expand(target);
        });
      });

      window.addEventListener('resize', function () {
        panels.forEach(function (p) {
          if (p.classList.contains('is-open')) p.style.height = 'auto';
        });
      });
    });
  })();
</script>
