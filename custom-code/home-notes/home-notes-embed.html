<!-- 首頁「現場小紙條」：弧形走帶。放在 .section_home-notes 內、走帶之後的 HTML Embed。
     只負責「卡片越靠近中間越高」與慢速漂移；進場、hover、光暈等動畫都在 IX3。
     Webflow 樣式面板做不到的幾條 CSS（隱藏捲軸、手機 snap、文字平衡）由程式注入。 -->
<script>
(function () {
  var css = '.home-notes_track{scrollbar-width:none;-webkit-overflow-scrolling:touch}.home-notes_track::-webkit-scrollbar{display:none}.home-notes_track.is-dragging{cursor:grabbing;user-select:none}.home-notes_item{will-change:transform}.home-notes_quote{text-wrap:balance}.home-notes_track.is-static{scroll-snap-type:x mandatory;padding-left:max(1.25rem,calc(50% - 8.75rem));padding-right:max(1.25rem,calc(50% - 8.75rem))}.home-notes_track.is-static .home-notes_item{scroll-snap-align:center}';
  if (!document.getElementById('home-notes-style')) {
    var st = document.createElement('style'); st.id = 'home-notes-style'; st.textContent = css;
    document.head.appendChild(st);
  }
  var section = (document.currentScript && document.currentScript.closest('.section_home-notes')) || document.querySelector('.section_home-notes');
  if (!section) return;
  var track = section.querySelector('.home-notes_track');
  if (!track || track.dataset.homeNotesReady) return;
  track.dataset.homeNotesReady = '1';

  var originals = Array.prototype.slice.call(track.children);
  var count = originals.length;
  if (!count) return;

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var coarse = window.matchMedia('(pointer: coarse)').matches;
  var auto = !reduce && !coarse;          // 手機與「減少動態」：不自動走，改手指滑
  var SPEED = 30;                         // 每秒 30px
  var DROP_REM = auto ? 3.75 : 1.375;     // 面板邊緣的卡片比中央低多少

  if (auto) {
    // 複製一組接在後面，做出無縫循環。同步執行，IX3 初始化時複本已存在。
    originals.forEach(function (el) {
      var c = el.cloneNode(true);
      c.setAttribute('aria-hidden', 'true');
      track.appendChild(c);
    });
  } else {
    track.classList.add('is-static');
  }

  var items = Array.prototype.slice.call(track.children);
  var centers = [], half = 0, pos = 0, last = 0, drop = 60;
  var hover = false, drag = null, visible = true, started = false;

  function measure() {
    var rem = parseFloat(getComputedStyle(document.documentElement).fontSize) || 16;
    drop = DROP_REM * rem;
    centers = items.map(function (i) { return i.offsetLeft + i.offsetWidth / 2; });
    half = auto ? items[count].offsetLeft - items[0].offsetLeft : 0;
  }
  function shape() {
    var w = track.clientWidth, mid = track.scrollLeft + w / 2, span = w / 2;
    for (var i = 0; i < items.length; i++) {
      var d = Math.min(Math.abs(centers[i] - mid) / span, 1.25);
      items[i].style.transform = 'translate3d(0,' + (drop * d * d).toFixed(1) + 'px,0)';
    }
  }
  function wrap() {
    if (!auto || !half) return;
    if (pos >= half) pos -= half; else if (pos < 0) pos += half;
  }
  function tick(t) {
    var dt = last ? Math.min(t - last, 64) : 16; last = t;
    if (visible) {
      if (auto && !hover && !drag) { pos += SPEED * dt / 1000; wrap(); track.scrollLeft = pos; }
      shape();
    }
    requestAnimationFrame(tick);
  }
  function init() {
    measure();
    if (auto && !started) { started = true; pos = centers[2] - track.clientWidth / 2; wrap(); track.scrollLeft = pos; }
    shape();
  }

  track.addEventListener('scroll', function () {
    if (Math.abs(track.scrollLeft - pos) > 1.5) {
      pos = track.scrollLeft;
      if (auto && half && (pos >= half || pos <= 0)) { wrap(); track.scrollLeft = pos; }
    }
  }, { passive: true });
  track.addEventListener('pointerenter', function () { hover = true; });
  track.addEventListener('pointerleave', function () { hover = false; });
  track.addEventListener('pointerdown', function (e) {
    if (e.pointerType !== 'mouse') return;
    drag = { x: e.clientX, s: track.scrollLeft };
    track.classList.add('is-dragging');
  });
  window.addEventListener('pointermove', function (e) {
    if (!drag) return;
    pos = drag.s - (e.clientX - drag.x); wrap(); track.scrollLeft = pos;
  });
  window.addEventListener('pointerup', function () { drag = null; track.classList.remove('is-dragging'); });
  window.addEventListener('resize', init);
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (es) { visible = es[0].isIntersecting; }, { rootMargin: '200px' }).observe(section);
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(init);
  window.addEventListener('load', init);
  init();
  requestAnimationFrame(tick);
})();
</script>
