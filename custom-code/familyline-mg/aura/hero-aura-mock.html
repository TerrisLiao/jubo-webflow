<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#f5f3ee;font-family:"Noto Sans TC",sans-serif}
.aura{position:relative;width:960px;height:440px;margin:40px auto;border-radius:36px;overflow:hidden;background:#e7e3da}
.s{position:absolute;top:-25%;height:150%;border-radius:50%;filter:blur(34px);opacity:.95}
.s1{left:-6%;width:18%;background:#e9c96a;animation:d1 14s ease-in-out infinite alternate}
.s2{left:8%;width:14%;background:#9fb7d6;animation:d2 11s ease-in-out infinite alternate}
.s3{left:20%;width:16%;background:#f2dc8f;animation:d1 16s ease-in-out infinite alternate-reverse}
.s4{left:33%;width:12%;background:#7f97c9;animation:d2 12s ease-in-out infinite alternate}
.s5{left:44%;width:17%;background:#b9a6e8;animation:d1 15s ease-in-out infinite alternate}
.s6{left:58%;width:13%;background:#6fd0d6;animation:d2 13s ease-in-out infinite alternate-reverse}
.s7{left:69%;width:16%;background:#e8d27c;animation:d1 12s ease-in-out infinite alternate}
.s8{left:82%;width:14%;background:#8c9fd8;animation:d2 16s ease-in-out infinite alternate}
.s9{left:93%;width:15%;background:#c7b6ee;animation:d1 13s ease-in-out infinite alternate-reverse}
@keyframes d1{from{transform:translateX(-35%) scaleX(.9)}to{transform:translateX(35%) scaleX(1.15)}}
@keyframes d2{from{transform:translateX(30%) scaleX(1.1)}to{transform:translateX(-30%) scaleX(.85)}}
.flute{position:absolute;inset:0;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,0) 0px,rgba(255,255,255,.16) 11px,rgba(255,255,255,0) 23px,rgba(30,40,80,.06) 35px,rgba(255,255,255,0) 47px),repeating-linear-gradient(90deg,rgba(255,255,255,0) 0px,rgba(255,255,255,.12) 19px,rgba(255,255,255,0) 41px,rgba(30,40,80,.05) 58px,rgba(255,255,255,0) 79px)}
.grain{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 45%,rgba(30,40,70,.12))}
.card{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);width:380px;background:#fff;border-radius:16px;box-shadow:0 20px 40px -20px rgba(20,30,60,.45);padding:14px 16px;font-size:13px}
.card b{display:flex;gap:8px;align-items:center;font-size:14px}.dot{width:8px;height:8px;border-radius:50%;background:#00b2c0}
.row{display:flex;justify-content:space-between;color:#5b676c;margin-top:8px;padding-top:8px;border-top:1px solid #eef1f2}
.phone{position:absolute;left:54%;top:56px;width:250px;height:520px;border-radius:38px;overflow:hidden;background:#f3f5f6;box-shadow:0 0 0 7px #1d2125,0 30px 50px -20px rgba(11,53,88,.5);font-size:13px;z-index:3}
.pt{padding:30px 14px 12px;background:#fff;text-align:center;font-weight:700;font-size:14px;border-bottom:1px solid #e6ebed}.pb{padding:12px}.pc{background:#fff;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.pr{display:flex;justify-content:space-between;padding:3px 4px}.hl{background:#fff4ea;border-radius:6px}.hi{color:#ee7c1e;font-weight:700}.mu{color:#8b979b}.pill{font-size:11px;background:#ffe8d5;color:#c25f0f;border-radius:99px;padding:0 6px}
.st{position:absolute;left:9%;top:150px;width:320px;z-index:4;background:rgba(255,255,255,.92);border-radius:16px;box-shadow:0 20px 40px -20px rgba(20,30,60,.45);padding:14px 16px;font-size:13px}
.st b{display:flex;gap:8px;align-items:center;font-size:14px}.st .row{display:flex;justify-content:space-between;color:#5b676c;margin-top:8px;padding-top:8px;border-top:1px solid #eef1f2}
.st2{position:absolute;left:14%;top:262px;z-index:4;background:rgba(255,255,255,.85);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;color:#0b6f78;box-shadow:0 12px 24px -12px rgba(11,53,88,.4)}
</style></head><body><div class="aura"><div class="s s1"></div><div class="s s2"></div><div class="s s3"></div><div class="s s4"></div><div class="s s5"></div><div class="s s6"></div><div class="s s7"></div><div class="s s8"></div><div class="s s9"></div><div class="flute"></div><div class="grain"></div>
