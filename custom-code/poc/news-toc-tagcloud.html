<!--
  通用版：AEO /news 文章文字雲目錄 Code Embed。
  貼在文章 H1 後、導言前；換文章時，請替換下方連結的短標籤與 data-heading。

  視覺規則：
  - 沿用官網 glass button 的視覺語言，但不直接掛 .glass-button（該 class 被 Slater 外部程式綁定）。
  - 不使用黑色或灰色外框；玻璃感由半透明漸層、inset highlight、陰影與 backdrop-filter 組成。
  - 文字使用 --neutral--black，字重 400。

  連結規則：
  - data-heading 必須填文章中完整的 H2/H3 文字；畫面上的短標籤可以另寫。
  - 最穩定的做法是先透過 CMS API 給標題永久 id；若沒有 id，腳本才會依文字比對補上。
  - 腳本只在目前這個 Embed 與所屬 .w-richtext 範圍內工作，不會影響其他文章元件。
-->
<div class="aeo-toc-embed">
  <style>
    .aeo-toc,
    .aeo-toc *,
    .aeo-toc *::before,
    .aeo-toc *::after {
      box-sizing: border-box;
    }

    .aeo-toc {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin: 0 0 2rem;
      padding: 0;
      list-style: none;
    }

    .aeo-toc li {
      margin: 0;
      padding: 0;
    }

    .aeo-toc a {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      min-height: 3.25rem;
      padding: 0.7rem 1.5rem 0.75rem;
      border: 0;
      border-radius: 900px;
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.72),
        rgba(255, 255, 255, 0.28)
      );
      box-shadow:
        inset 0 1px 1px rgba(255, 255, 255, 0.9),
        inset 0 -1px 1px rgba(21, 23, 23, 0.08),
        0 8px 24px rgba(21, 23, 23, 0.08);
      -webkit-backdrop-filter: blur(14px) saturate(150%);
      backdrop-filter: blur(14px) saturate(150%);
      color: var(--neutral--black);
      font-size: 1.125rem;
      font-weight: 400;
      line-height: 1.5;
      text-decoration: none;
      transition:
        transform 180ms ease,
        background 180ms ease,
        box-shadow 180ms ease;
    }

    .aeo-toc a::before {
      position: absolute;
      z-index: -1;
      inset: 1px;
      border-radius: inherit;
      background: linear-gradient(
        145deg,
        rgba(255, 255, 255, 0.45),
        rgba(255, 255, 255, 0) 58%
      );
      content: "";
      pointer-events: none;
    }

    .aeo-toc a:hover {
      transform: translateY(-2px);
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.82),
        rgba(255, 255, 255, 0.38)
      );
      box-shadow:
        inset 0 1px 1px rgba(255, 255, 255, 0.95),
        inset 0 -1px 1px rgba(21, 23, 23, 0.06),
        0 12px 28px rgba(21, 23, 23, 0.12);
    }

    .aeo-toc a:focus-visible {
      outline: 3px solid var(--primary--accent);
      outline-offset: 3px;
    }

    @media (max-width: 767px) {
      .aeo-toc {
        gap: 0.5rem;
        margin-bottom: 1.5rem;
      }

      .aeo-toc a {
        min-height: 3rem;
        padding: 0.625rem 1.25rem;
        font-size: 1rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .aeo-toc a {
        transition: none;
      }
    }
  </style>

  <nav aria-label="文章目錄">
    <ul class="aeo-toc">
      <!-- 以下為範例；換文章時請整段替換 -->
      <li><a href="#section-1" data-heading="居服與日照，處理同一件事的兩種樣子">居服 vs 日照</a></li>
      <li><a href="#section-2" data-heading="居服端：班表與核銷是主軸">居服端重點</a></li>
      <li><a href="#section-3" data-heading="日照端：照顧計畫、日常流程與家屬溝通">日照端重點</a></li>
      <li><a href="#section-4" data-heading="第一線的入口是手機，不是電腦">行動裝置優先</a></li>
      <li><a href="#section-5" data-heading="系統之外的那一半">系統外的事</a></li>
      <li><a href="#section-6" data-heading="併入智齡之後，這套系統的位置在哪裡">併購後現況</a></li>
      <li><a href="#section-faq" data-heading="常見問題">常見問題</a></li>
    </ul>
  </nav>

  <script>
    (function () {
      var scriptEl = document.currentScript;

      function normalize(text) {
        return (text || "").replace(/\s+/g, "").trim();
      }

      function run() {
        var embed = scriptEl.closest(".aeo-toc-embed");
        var toc = embed && embed.querySelector(".aeo-toc");
        var scope = scriptEl.closest(".w-richtext") || document;
        if (!toc) return;

        var links = toc.querySelectorAll('a[href^="#"]');
        var headings = scope.querySelectorAll("h1, h2, h3, h4, h5, h6");

        links.forEach(function (link) {
          var requestedId = link.getAttribute("href").slice(1);
          var target = requestedId
            ? scope.querySelector("#" + CSS.escape(requestedId))
            : null;

          if (!target) {
            var label = normalize(link.dataset.heading || link.textContent);

            for (var index = 0; index < headings.length; index += 1) {
              var heading = headings[index];
              var headingText = normalize(heading.textContent);

              if (
                headingText === label ||
                headingText.indexOf(label) !== -1 ||
                label.indexOf(headingText) !== -1
              ) {
                target = heading;
                break;
              }
            }
          }

          if (!target) return;
          if (!target.id) target.id = requestedId;
          link.setAttribute("href", "#" + target.id);
        });

        links.forEach(function (link) {
          if (link.dataset.aeoTocBound) return;
          link.dataset.aeoTocBound = "1";

          link.addEventListener("click", function (event) {
            var id = link.getAttribute("href").slice(1);
            var target = scope.querySelector("#" + CSS.escape(id));
            if (!target) return;

            event.preventDefault();
            target.scrollIntoView({ behavior: "smooth", block: "start" });
            history.replaceState(null, "", "#" + id);
          });
        });
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", run);
      } else {
        run();
      }

      window.addEventListener("load", run);
    })();
  </script>
</div>
